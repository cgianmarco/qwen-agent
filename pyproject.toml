[project]
name = "qwen-agent"
version = "0.1.0"
description = "A minimal Qwen agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.2",
]

[project.scripts]
qwen-agent = "qwen_agent.agent:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
